<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ST MCU Selector | STMicroelectronics</title>
  <meta name="description" content="ST MCU Selector：按必须满足的规格、已核实的竞品参数或 STM32 订货号，从意法半导体公开 MCU 数据库给出最多三个候选。结果是短名单，设计前需核对 datasheet。">
  <meta name="keywords" content="ST MCU Selector, STM32, MCU 选型, 订货号, 竞品对照">
  <meta property="og:title" content="ST MCU Selector | STMicroelectronics">
  <meta property="og:description" content="ST MCU Selector：按必须满足的规格、已核实的竞品参数或 STM32 订货号，从意法半导体公开 MCU 数据库给出最多三个候选。结果是短名单，设计前需核对 datasheet。">
  <meta name="twitter:title" content="ST MCU Selector | STMicroelectronics">
  <meta name="twitter:description" content="ST MCU Selector：按必须满足的规格、已核实的竞品参数或 STM32 订货号，从意法半导体公开 MCU 数据库给出最多三个候选。结果是短名单，设计前需核对 datasheet。">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./forms.css">
</head>
<body>
  <div id="root">
    <header class="hero">
      <div class="hero-accent" aria-hidden="true"></div>
      <div class="hero-inner">
        <div class="brand">
          <img class="brand-logo" src="./st-logo.svg" width="94" height="51" alt="STMicroelectronics">
          <h1 class="title-bar">MCU Selector</h1>
          <p class="db-pill" id="db-status">器件库加载中</p>
        </div>
      </div>
      <p class="message-bar">
        <span>数据库匹配只给候选；最多给出三个订货号。这是短名单，不是设计签核。封装引脚、外设并发、认证、价格和供货仍须核对当前 datasheet。</span>
      </p>
    </header>

    <main class="page">
      <div class="modes" role="tablist" aria-label="选择任务">
        <button class="mode is-active" type="button" role="tab" id="tab-requirements" data-mode="requirements" aria-selected="true" aria-controls="form-requirements" tabindex="0">
          <span class="mode-head">按需求推荐</span>
          <span class="mode-body">按必须规格拿三颗候选</span>
        </button>
        <button class="mode" type="button" role="tab" id="tab-competitor" data-mode="competitor" aria-selected="false" aria-controls="form-competitor" tabindex="-1">
          <span class="mode-head">竞品对照</span>
          <span class="mode-body">用已核实规格对照 STM32</span>
        </button>
        <button class="mode" type="button" role="tab" id="tab-inspect" data-mode="inspect" aria-selected="false" aria-controls="form-inspect" tabindex="-1">
          <span class="mode-head">查看订货号</span>
          <span class="mode-body">核对其在库里是什么</span>
        </button>
      </div>

      <p class="banner" id="banner"></p>

      <form id="form-requirements" class="form-panel is-open" role="tabpanel" aria-labelledby="tab-requirements">
        <div class="form-grid">
          <label class="field">应用
            <select name="application">
              <option value="">不指定</option>
              <option value="motor_control">电机控制</option>
              <option value="power_conversion">电源变换</option>
              <option value="bms">电池管理</option>
              <option value="industrial_control">工业控制</option>
              <option value="iot">物联网</option>
            </select>
          </label>
          <label class="field">主频至少 (MHz)
            <input name="frequency_mhz" type="number" min="1" placeholder="例如 170">
          </label>
          <label class="field">Flash 至少 (KB)
            <input name="flash_kb" type="number" min="1" placeholder="例如 512">
          </label>
          <label class="field">RAM 至少 (KB)
            <input name="ram_kb" type="number" min="1">
          </label>
          <label class="field">引脚数不超过
            <input name="pin_count" type="number" min="8" placeholder="例如 64">
          </label>
          <label class="field">封装
            <select name="package_type">
              <option value="">不限制</option>
              <option value="LQFP">LQFP</option>
              <option value="QFN">QFN</option>
              <option value="BGA">BGA</option>
              <option value="WLCSP">WLCSP</option>
            </select>
          </label>
          <label class="field">最高工作温度至少 (°C)
            <input name="temperature_max_c" type="number" placeholder="例如 125">
          </label>
          <label class="field">FDCAN 至少
            <input name="fdcan" type="number" min="0" placeholder="例如 1">
          </label>
          <label class="field">USB 至少
            <input name="usb" type="number" min="0" placeholder="例如 1">
          </label>
          <label class="field">电机定时器至少
            <input name="motor_timers" type="number" min="0" placeholder="例如 1">
          </label>
          <label class="field">HRTIM 至少
            <input name="hrtim" type="number" min="0" placeholder="例如 1">
          </label>
          <label class="field">缺字段策略
            <select name="unknown_policy">
              <option value="allow_risk">保留并标出风险</option>
              <option value="exclude">库中无证据则排除</option>
            </select>
          </label>
        </div>
        <div class="actions"><button type="submit">给出短名单</button></div>
      </form>

      <form id="form-competitor" class="form-panel" role="tabpanel" aria-labelledby="tab-competitor" hidden>
        <div class="form-grid">
          <label class="field">厂商
            <input name="manufacturer" required placeholder="例如 NXP">
          </label>
          <label class="field">竞品订货号
            <input name="part_number" required>
          </label>
          <label class="field span-3">规格来源（datasheet 链接、版本或页码）
            <input name="source_note" required minlength="5" placeholder="必须填写已核实来源，不能留空">
          </label>
          <label class="field">主频 (MHz)
            <input name="frequency_mhz" type="number">
          </label>
          <label class="field">Flash (KB)
            <input name="flash_kb" type="number">
          </label>
          <label class="field">RAM (KB)
            <input name="ram_kb" type="number">
          </label>
          <label class="field">引脚数
            <input name="pin_count" type="number">
          </label>
          <label class="field">封装
            <input name="package_type" placeholder="例如 LQFP">
          </label>
          <label class="field">FDCAN
            <input name="fdcan" type="number">
          </label>
          <label class="field">USB
            <input name="usb" type="number">
          </label>
          <label class="field">电机定时器
            <input name="motor_timers" type="number">
          </label>
          <label class="field">HRTIM
            <input name="hrtim" type="number">
          </label>
        </div>
        <div class="actions"><button type="submit">对照相近 STM32</button></div>
      </form>

      <form id="form-inspect" class="form-panel" role="tabpanel" aria-labelledby="tab-inspect" hidden>
        <div class="form-grid">
          <label class="field span-2">STM32 订货号
            <input name="part_number" required minlength="3" placeholder="例如 STM32G474RET3">
          </label>
        </div>
        <div class="actions"><button type="submit">查看这颗料</button></div>
      </form>

      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <footer>
      <span>ST MCU Selector · 公开 MCU 数据库短名单</span>
      <span>created by: helon.chen@st.com; yude.jiang@st.com · <time id="footer-date"></time></span>
      <span>STMicroelectronics. All trademarks are the property of their respective owners.</span>
    </footer>
  </div>
  <script src="./facts.js"></script>
  <script src="./app.js"></script>
</body>
</html>
